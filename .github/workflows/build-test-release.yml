name: Build, Test & Release Loop Studio Stack

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Same as foodshare pattern: cancel superseded runs, GitHub-hosted runners.
# Cancel-in-progress is scoped to non-main so a fast-follow push can never
# kill an in-flight test→release publish on main mid-release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    name: Test
    # macos-15 rather than macos-14: the macos-14 image is itself being
    # deprecated (unsupported from November), and macos-15 ships the Xcode 26
    # the Swift app's macOS 26 API needs.
    runs-on: macos-15
    defaults:
      run:
        shell: bash
        working-directory: .
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The Swift package declares `swift-tools-version: 6.0` and uses the
      # macOS 26 `.glassEffect` refraction API, so it needs the macOS 26 SDK
      # — Xcode 26 or later. The image's default Xcode is 16.4, whose SDK has
      # no `glassEffect` at all, and the gate failed with "value of type
      # 'Self' has no member 'glassEffect'". Select the Xcode explicitly
      # rather than inheriting whatever the image defaults to.
      - name: Select Xcode (macOS 26 SDK)
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app
          swift --version
          xcodebuild -showsdks | grep -i macos

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-src

      - name: Build release binaries
        run: cargo build --manifest-path rust-src/Cargo.toml --locked --release

      - name: Run delivery gate
        run: make delivery-index validate

      - name: Upload release binaries
        uses: actions/upload-artifact@v4
        with:
          name: loop-studio-release-${{ github.sha }}
          path: |
            rust-src/target/release/loop-studio
            rust-src/target/release/loop-studio-router
            rust-src/target/release/loop-studio-tui
            rust-src/target/release/bootstrap
            rust-src/target/release/serve-mlx
            rust-src/target/release/serve-llama
            rust-src/target/release/pull-models
            rust-src/target/release/kv-manage
          retention-days: 30

  # Publish release binaries — runs on macos-15 so it shares the runner
  # arch with the build job (Apple Silicon ARM64 binaries cannot be
  # inspected on ubuntu-24.04).
  release:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: loop-studio-release-${{ github.sha }}
          path: ./artifacts

      - name: Verify binaries are executable ARM64
        run: |
          for bin in ./artifacts/loop-studio ./artifacts/loop-studio-router ./artifacts/serve-mlx; do
            test -x "$bin" && file "$bin" | grep -q "arm64" && echo "✓ $bin" || (echo "✗ $bin not arm64 executable" && exit 1)
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.9.${{ github.run_number }}
          files: ./artifacts/*
          fail_on_unmatched_files: true
          name: Loop Studio v2.9 Release
          body: |
            ## Loop Studio v2.9 — Full Rust Stack + Mac Studio Ready

            ### What's new in v2.9
            - **Modular Rust codebase**: `common.rs` → 10 sub-modules, `loop_studio.rs` → 9 modules
            - **Router hardening**: typed `Backend` enum, `handle_connection` decomposed
            - **State dir renamed**: `~/.lac` → `~/.loop-studio` (all 22 files updated)
            - **Hermes best practices**: context limit injection, phase checkpoints, `--parallel N`, thermal Q8→Q4 auto-throttle, auto-save every 5min, context pressure check, thermal CSV logging, minor findings JSONL
            - **daemon install now includes serve-mlx** with HF_HOME retargeting
            - **bootstrap runs `mise install`** automatically on fresh machines
            - **pull-models preflights ollama** daemon before attempting pull
            - **plist `$USER` literal fixed** — launchd never expands shell vars
            - **Swift GatewayClient refactor**: clean seam (request in, typed events out)
            - **642 tests pass**, zero flaky tests, CI stable

            ### Day-One (Mac Studio)
            ```bash
            brew bundle install && mise install
            make build && make install
            loop-studio bootstrap
            brew services start ollama && loop-studio pull-models
            make daemon-install
            loop-studio doctor
            ```

            ### Binaries (Apple Silicon ARM64, macOS 13+)
            - `loop-studio` — unified CLI (status, serve, route, worker, hermes, doctor, bench, kv, loop)
            - `loop-studio-router` — intelligent reverse proxy on :8000 (EWMA, circuit breaker, auth)
            - `loop-studio-tui` — full terminal control centre
            - `bootstrap` — idempotent machine setup
            - `serve-mlx` — MLX inference launcher with port-drift detection
            - `serve-llama` — llama-server launcher (Q8_0, Flash Attention)
            - `pull-models` — Qwen3.8-27B model puller with ollama preflight
            - `kv-manage` — KV cache risk analyser and truncation engine
            - KV risk levels: GREEN/YELLOW/RED with escalation invariants
          draft: false
